# City / station configuration.
# One series per city. v0 only covers KXHIGHNY — add cities only after
# the whole pipeline (settlement → alpha) passes for NY.

cities:
  - series_ticker: KXHIGHNY
    city: "New York"
    location: "Central Park"
    station_id: "KNYC"            # NWS ASOS site for Central Park
    lat: 40.7790
    lon: -73.9692
    timezone: "America/New_York"
    target: "max_temperature"     # daily maximum temperature
    unit: "fahrenheit"
    settlement:
      day_window: "local_standard"   # NWS DCR: midnight-to-midnight local STANDARD time
      rounding: 0.5                  # Kalshi buckets are 1F; strikes centered on integers
      source: "NWS Daily Climate Report"  # CLINYC final daily max = settlement truth
