[project]
name = "weadge"
version = "0.1.0"
description = "Weather prediction-market alpha research engine (Kalshi KXHIGHNY first)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "auren23" }]
keywords = ["weather", "prediction-markets", "kalshi", "alpha-research", "calibration"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "polars>=1.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "zstandard>=0.22",
    "cryptography>=42.0",  # Kalshi request signing (RSA-PSS) for authenticated endpoints
    "pygrib>=2.1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "pyright>=1.1.360",
]

[project.scripts]
weadge = "weadge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weadge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not network\""
asyncio_mode = "auto"
markers = [
    "network: tests that hit live external APIs (not run by default)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length enforced by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
include = ["src"]
typeCheckingMode = "basic"
